[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Use an in-memory database for tests
env =
    DATABASE_URL=sqlite+aiosqlite:///:memory:
    OLLAMA_BASE_URL=http://localhost:11434
    OLLAMA_MODEL=qwen3:8b
    GEMINI_API_KEY=test-key
    LOG_LEVEL=WARNING
