<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline-First AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 and ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for inline JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Detect API base URL
    const API_BASE = window.location.origin.includes('8001') ? window.location.origin : 'http://127.0.0.1:8001';

    function App() {
      const [health, setHealth] = useState({ status: 'unknown', ollama: false, gemini: false });
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [conversations, setConversations] = useState([]);
      const [activeConversationId, setActiveConversationId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [isStreaming, setIsStreaming] = useState(false);
      const [expandedTelemetry, setExpandedTelemetry] = useState({});
      const bottomRef = useRef(null);
      const abortRef = useRef(null);

      const fetchHealth = async () => {
        setIsRefreshing(true);
        try {
          const res = await fetch(`${API_BASE}/health`);
          if (res.ok) setHealth(await res.json());
        } catch (e) {
          setHealth({ status: 'offline', ollama: false, gemini: false });
        } finally {
          setIsRefreshing(false);
        }
      };

      const fetchConversations = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/conversations`);
          if (res.ok) setConversations(await res.json());
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        fetchHealth();
        fetchConversations();
        const interval = setInterval(fetchHealth, 25000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const selectConversation = async (id) => {
        if (isStreaming) abortRef.current?.abort();
        setActiveConversationId(id);
        try {
          const res = await fetch(`${API_BASE}/api/conversations/${id}`);
          if (res.ok) {
            const data = await res.json();
            setMessages(data.messages || []);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const startNewChat = () => {
        if (isStreaming) abortRef.current?.abort();
        setActiveConversationId(null);
        setMessages([]);
      };

      const sendMessage = async (promptText) => {
        const text = promptText || input.trim();
        if (!text || isStreaming) return;
        setInput('');

        const userMsg = { id: `u-${Date.now()}`, role: 'user', content: text };
        const assistantMsg = { id: `a-${Date.now()}`, role: 'assistant', content: '', provider: '', isStreaming: true, latency: {} };
        setMessages((prev) => [...prev, userMsg, assistantMsg]);
        setIsStreaming(true);

        const controller = new AbortController();
        abortRef.current = controller;

        try {
          const res = await fetch(`${API_BASE}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: text,
              conversation_id: activeConversationId || undefined,
              stream: true,
            }),
            signal: controller.signal,
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || `Server returned ${res.status}`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('data:')) continue;
              const jsonStr = trimmed.slice(5).trim();
              try {
                const data = JSON.parse(jsonStr);
                if (data.type === 'token') {
                  setMessages((prev) => {
                    const next = [...prev];
                    const last = next[next.length - 1];
                    if (last && last.role === 'assistant') {
                      next[next.length - 1] = { ...last, content: last.content + data.content };
                    }
                    return next;
                  });
                } else if (data.type === 'complete') {
                  setIsStreaming(false);
                  if (data.conversation_id && data.conversation_id !== activeConversationId) {
                    setActiveConversationId(data.conversation_id);
                    fetchConversations();
                  }
                  setMessages((prev) => {
                    const next = [...prev];
                    const last = next[next.length - 1];
                    if (last && last.role === 'assistant') {
                      next[next.length - 1] = { ...last, isStreaming: false, provider: data.provider, latency: data.latency || {} };
                    }
                    return next;
                  });
                } else if (data.type === 'error') {
                  setIsStreaming(false);
                  setMessages((prev) => {
                    const next = [...prev];
                    const last = next[next.length - 1];
                    if (last && last.role === 'assistant') {
                      next[next.length - 1] = { ...last, isStreaming: false, isError: true, content: data.message };
                    }
                    return next;
                  });
                }
              } catch (e) {}
            }
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            setIsStreaming(false);
            setMessages((prev) => {
              const next = [...prev];
              const last = next[next.length - 1];
              if (last && last.role === 'assistant') {
                next[next.length - 1] = { ...last, isStreaming: false, isError: true, content: err.message };
              }
              return next;
            });
          }
        }
      };

      const stopStreaming = () => {
        abortRef.current?.abort();
        setIsStreaming(false);
        setMessages((prev) => {
          const next = [...prev];
          const last = next[next.length - 1];
          if (last && last.role === 'assistant') {
            next[next.length - 1] = { ...last, isStreaming: false };
          }
          return next;
        });
      };

      const toggleTelemetry = (msgId) => {
        setExpandedTelemetry((prev) => ({ ...prev, [msgId]: !prev[msgId] }));
      };

      return (
        <div className="flex flex-col h-screen w-screen overflow-hidden">
          {/* Header */}
          <header className="h-16 border-b border-slate-800 bg-slate-900/90 px-6 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
                AI
              </div>
              <div>
                <h1 className="text-base font-semibold text-white flex items-center gap-2">
                  Offline-First AI Assistant
                  <span className="text-[11px] font-normal px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">React Frontend</span>
                </h1>
                <p className="text-xs text-slate-400">Ollama/Qwen3 Local Primary • Gemini Online Fallback</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* Ollama Badge */}
              <div className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-medium ${
                health.ollama ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-rose-500/10 border-rose-500/20 text-rose-300'
              }`}>
                <span>Local Ollama</span>
                <span className={`w-2 h-2 rounded-full ${health.ollama ? 'bg-emerald-400 animate-pulse' : 'bg-rose-400'}`}></span>
              </div>

              {/* Gemini Badge */}
              <div className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-medium ${
                health.gemini ? 'bg-sky-500/10 border-sky-500/30 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-400'
              }`}>
                <span>Gemini Fallback</span>
                <span className={`w-2 h-2 rounded-full ${health.gemini ? 'bg-sky-400' : 'bg-slate-500'}`}></span>
              </div>

              {/* Refresh */}
              <button
                onClick={fetchHealth}
                disabled={isRefreshing}
                className="p-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 text-xs transition"
                title="Refresh Status"
              >
                {isRefreshing ? '⌛' : '🔄'}
              </button>
            </div>
          </header>

          {/* Main Layout */}
          <div className="flex flex-1 overflow-hidden">
            {/* Sidebar */}
            <aside className="w-72 border-r border-slate-800 bg-slate-950 flex flex-col h-full">
              <div className="p-4 border-b border-slate-800">
                <button
                  onClick={startNewChat}
                  className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition shadow-md shadow-indigo-600/20"
                >
                  <span>+ New Chat</span>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-3 space-y-1">
                <div className="px-3 py-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">Recent Sessions</div>
                {conversations.length === 0 ? (
                  <div className="px-3 py-6 text-center text-xs text-slate-500">No saved chats yet.</div>
                ) : (
                  conversations.map((c) => {
                    const active = c.id === activeConversationId;
                    const preview = c.messages?.find((m) => m.role === 'user')?.content || `Chat ${c.id.slice(0, 8)}`;
                    return (
                      <button
                        key={c.id}
                        onClick={() => selectConversation(c.id)}
                        className={`w-full text-left p-3 rounded-xl transition flex flex-col gap-1 border ${
                          active ? 'bg-slate-800/90 border-slate-700 text-white' : 'border-transparent text-slate-400 hover:bg-slate-900 hover:text-slate-200'
                        }`}
                      >
                        <span className="text-sm font-medium truncate">{preview}</span>
                        <span className="text-[11px] text-slate-500">
                          {c.created_at ? new Date(c.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}
                        </span>
                      </button>
                    );
                  })
                )}
              </div>

              <div className="p-3 border-t border-slate-800 text-xs text-slate-500 text-center">
                SQLite Persistence Active
              </div>
            </aside>

            {/* Chat Body */}
            <main className="flex-1 flex flex-col bg-slate-900 overflow-hidden relative">
              <div className="flex-1 overflow-y-auto">
                {messages.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center p-8 text-center max-w-2xl mx-auto">
                    <div className="w-14 h-14 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mb-4 text-2xl">
                      ⚡
                    </div>
                    <h2 className="text-xl font-semibold text-white mb-2">Offline-First AI Assistant</h2>
                    <p className="text-sm text-slate-400 mb-8 max-w-md">
                      Tries local <strong className="text-emerald-400">Ollama (Qwen3)</strong> first. If unavailable, falls back to <strong className="text-sky-400">Gemini API</strong> without interrupting you.
                    </p>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full text-left">
                      {[
                        { title: "Explain Python in simple words", desc: "Fast token test with low latency" },
                        { title: "What are the benefits of offline LLMs?", desc: "Data privacy & zero cloud API costs" },
                        { title: "Write an async HTTP streaming function in Python", desc: "Code generation benchmark" },
                        { title: "How does provider fallback routing work?", desc: "Architecture and resilience explanation" }
                      ].map((item, idx) => (
                        <button
                          key={idx}
                          onClick={() => sendMessage(item.title)}
                          className="p-4 rounded-xl bg-slate-950 border border-slate-800 hover:border-slate-700 hover:bg-slate-800/60 transition text-xs text-slate-300 text-left"
                        >
                          <div className="font-semibold text-white mb-1">{item.title}</div>
                          <div className="text-slate-400">{item.desc}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="divide-y divide-slate-800/40">
                    {messages.map((msg, index) => {
                      const isUser = msg.role === 'user';
                      const isOllama = (msg.provider || '').toLowerCase().includes('ollama');
                      const isGemini = (msg.provider || '').toLowerCase().includes('gemini');
                      const hasLatency = msg.latency && Object.keys(msg.latency).length > 0;
                      const showTel = expandedTelemetry[msg.id || index];

                      return (
                        <div key={msg.id || index} className={`py-4 px-6 flex gap-4 ${isUser ? 'bg-slate-900/40' : 'bg-slate-800/30'}`}>
                          <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 text-xs font-bold ${
                            isUser ? 'bg-slate-700 text-slate-200' : isOllama ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : isGemini ? 'bg-sky-500/20 text-sky-400 border border-sky-500/30' : 'bg-indigo-600/20 text-indigo-400'
                          }`}>
                            {isUser ? 'YOU' : 'AI'}
                          </div>

                          <div className="flex-1 space-y-2 overflow-hidden">
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-semibold text-slate-300">{isUser ? 'You' : 'Assistant'}</span>
                              {!isUser && msg.provider && (
                                <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium border ${
                                  isOllama ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20' : isGemini ? 'bg-sky-500/10 text-sky-300 border-sky-500/20' : 'bg-slate-800 text-slate-400 border-slate-700'
                                }`}>
                                  {isOllama ? '🟢 Ollama (Local Qwen3)' : isGemini ? '🔵 Gemini (Cloud Fallback)' : msg.provider}
                                </span>
                              )}
                            </div>

                            <div className="text-sm text-slate-200 leading-relaxed whitespace-pre-wrap break-words">
                              {msg.content}
                              {msg.isStreaming && <span className="inline-block w-2 h-4 bg-indigo-400 animate-pulse ml-0.5 align-middle"></span>}
                            </div>

                            {msg.isError && (
                              <div className="p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs">
                                {msg.content}
                              </div>
                            )}

                            {!isUser && hasLatency && (
                              <div className="pt-1">
                                <button
                                  onClick={() => toggleTelemetry(msg.id || index)}
                                  className="text-xs text-slate-400 hover:text-slate-300 font-mono transition flex items-center gap-1"
                                >
                                  <span>📊 Latency: {msg.latency.total_time_ms ? `${msg.latency.total_time_ms}ms total` : 'view telemetry'}</span>
                                  <span>{showTel ? '▼' : '▶'}</span>
                                </button>

                                {showTel && (
                                  <div className="mt-2 p-3 rounded-xl bg-slate-950 border border-slate-800 font-mono text-xs grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    <div>
                                      <div className="text-[10px] text-slate-500">PROVIDER DECISION</div>
                                      <div className="font-semibold text-slate-300">{msg.latency.provider_selected || 0} ms</div>
                                    </div>
                                    <div>
                                      <div className="text-[10px] text-slate-500">LLM CONNECTED</div>
                                      <div className="font-semibold text-slate-300">{msg.latency.llm_started || 0} ms</div>
                                    </div>
                                    <div>
                                      <div className="text-[10px] text-slate-500">FIRST TOKEN (TTFT)</div>
                                      <div className="font-semibold text-emerald-400">{msg.latency.first_token || 0} ms</div>
                                    </div>
                                    <div>
                                      <div className="text-[10px] text-slate-500">TOTAL TIME</div>
                                      <div className="font-semibold text-indigo-400">{msg.latency.total_time_ms || 0} ms</div>
                                    </div>
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                    <div ref={bottomRef} />
                  </div>
                )}
              </div>

              {/* Chat Input Bar */}
              <div className="p-4 border-t border-slate-800 bg-slate-900/90">
                {!health.ollama && !health.gemini && (
                  <div className="mb-2 p-2 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs">
                    ⚠️ Both Ollama and Gemini appear offline. You can still test sending a message to verify the fallback error handling.
                  </div>
                )}

                <form onSubmit={(e) => { e.preventDefault(); sendMessage(); }} className="flex items-center gap-2 max-w-4xl mx-auto">
                  <input
                    type="text"
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    placeholder="Enter prompt (e.g. 'Explain Python in simple words')..."
                    className="flex-1 bg-slate-950 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none"
                  />
                  {isStreaming ? (
                    <button
                      type="button"
                      onClick={stopStreaming}
                      className="px-5 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-medium text-sm transition"
                    >
                      Stop
                    </button>
                  ) : (
                    <button
                      type="submit"
                      disabled={!input.trim()}
                      className="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-medium text-sm transition"
                    >
                      Send
                    </button>
                  )}
                </form>
              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
